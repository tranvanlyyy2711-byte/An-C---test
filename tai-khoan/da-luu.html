<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng đã lưu — An Cư</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#F5F7F5;
      --surface:#FFFFFF;
      --surface-2:#F2F7F2;
      --border:rgba(34,139,34,.12);
      --border-strong:rgba(34,139,34,.18);
      --text:#1A1D1A;
      --text-muted:#495649;
      --text-dim:#667565;
      --accent:#228B22;
      --accent-hover:#1D7C1D;
      --accent-fg:#FFFFFF;
      --danger:#E15B5B;
      --radius:12px;
      --radius-lg:16px;
      --sidebar-w:264px;
      --topbar-h:64px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter','Be Vietnam Pro',sans-serif;line-height:1.6}
    body{min-height:100vh}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    button,input,select{font:inherit}
    .brand{display:flex;align-items:center;gap:10px;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em}
    .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(120deg,#228B22 0%,#36A44A 100%);display:grid;place-items:center;font-size:15px;color:#fff;font-weight:800;flex-shrink:0}
    .dash-shell{display:flex;min-height:100vh}
    .side-nav{
      position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:120;
      display:flex;flex-direction:column;gap:4px;padding:22px 16px;border-right:1px solid var(--border);background:rgba(255,255,255,.96);
      overflow-y:auto;
    }
    .side-logo{padding:8px 10px 22px}
    .side-link{
      display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:8px;
      font-family:'Be Vietnam Pro',sans-serif;font-size:14.5px;font-weight:500;color:var(--text-muted);
      transition:background .18s ease,color .18s ease;
    }
    .side-link svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .side-link.active{color:var(--text);background:rgba(34,139,34,.14)}
    .dash-main{flex:1;min-width:0;margin-left:var(--sidebar-w);padding:48px 32px 64px}
    .container{max-width:1200px;margin:0 auto}
    .page-head{margin-bottom:24px}
    .page-head h1{font-size:clamp(1.8rem,3vw,2.4rem);margin:0 0 8px;letter-spacing:-.03em}
    .page-head p{margin:0;color:var(--text-muted)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .status-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-family:'Be Vietnam Pro',sans-serif;font-size:13px;font-weight:600}
    .status-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(34,139,34,.12)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:var(--accent-fg);font-family:'Be Vietnam Pro',sans-serif;font-weight:600;cursor:pointer;transition:all .18s ease
    }
    .btn:hover{background:var(--accent-hover)}
    .btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
    .btn.ghost:hover{background:var(--surface-2)}
    .saved-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .saved-card{display:flex;gap:14px;align-items:stretch;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 10px 24px rgba(17,24,39,.03)}
    .saved-card .img{position:relative;width:180px;flex-shrink:0}
    .saved-card .img img{width:100%;height:100%;object-fit:cover}
    .saved-card .img .badge{position:absolute;left:10px;bottom:10px;background:rgba(10,10,12,.8);color:#fff;border-radius:999px;padding:5px 10px;font-size:11px;font-family:'Be Vietnam Pro',sans-serif;font-weight:600}
    .saved-card .content{flex:1;min-width:0;padding:16px 16px 16px 0;display:flex;flex-direction:column;gap:10px}
    .saved-card h3{margin:0;font-size:1.05rem;line-height:1.35}
    .saved-card .meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--text-muted);font-size:13px}
    .saved-card .meta span{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
    .saved-card .meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
    .saved-card .actions{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
    .saved-card .actions .btn{height:40px;font-size:14px}
    .saved-card .remove-btn{border-color:rgba(225,91,91,.26);background:rgba(225,91,91,.06);color:var(--danger)}
    .saved-card .remove-btn:hover{background:rgba(225,91,91,.12)}
    .empty{display:none;text-align:center;padding:56px 24px;border:1px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--surface)}
    .empty.show{display:block}
    .empty h2{margin:0 0 8px;font-size:1.4rem}
    .empty p{margin:0 0 18px;color:var(--text-muted)}
    @media (max-width:960px){
      .side-nav{transform:translateX(-100%);top:0;height:100vh;z-index:100}
      .dash-main{margin-left:0;padding:24px 20px 48px}
      .saved-grid{grid-template-columns:1fr}
    }
    @media (max-width:640px){
      .saved-card{flex-direction:column}
      .saved-card .img{width:100%;height:220px}
      .saved-card .content{padding:14px}
    }
  </style>
</head>
<body>
  <div class="dash-shell">
    <aside class="side-nav" id="sideNav">
      <a href="tim-phong.html" class="brand side-logo"><span class="mark">A</span> An Cư</a>
      <nav aria-label="Điều hướng khu vực người thuê">
        <a href="tim-phong.html" class="side-link" data-route="/tai-khoan/tim-phong">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          Tìm phòng
        </a>
        <a href="da-luu.html" class="side-link active" data-route="/tai-khoan/da-luu" aria-current="page">
          <svg viewBox="0 0 24 24"><path d="M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>
          Phòng đã lưu
        </a>
        <a href="dat-lich.html" class="side-link" data-route="/tai-khoan/lich-xem">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>
          Lịch xem phòng
        </a>
      </nav>
    </aside>

    <main class="dash-main">
      <div class="container">
        <header class="page-head">
          <h1>Phòng đã lưu</h1>
          <p>Danh sách phòng bạn đã lưu để so sánh và đặt lịch xem sau này.</p>
        </header>

        <div class="toolbar">
          <div class="status-pill"><span class="dot"></span><span id="savedCount">0 phòng</span></div>
          <a href="tim-phong.html" class="btn ghost">Tiếp tục tìm phòng</a>
        </div>

        <div id="savedList" class="saved-grid"></div>

        <div id="emptyState" class="empty">
          <h2>Chưa có phòng nào được lưu</h2>
          <p>Hãy lưu một số phòng từ trang tìm phòng để xem lại ở đây.</p>
          <a href="tim-phong.html" class="btn">Tìm phòng ngay</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    var SAVED_KEY = 'an_cu_saved_rooms';
    var ROOMS = [
      {id:'r01', title:'Phòng trọ gần Đại học Quốc Gia', price:2800000, area:18, people:2, ward:'P. Dịch Vọng Hậu', district:'Cầu Giấy', address:'34 Trần Thái Tông, P. Dịch Vọng Hậu, Cầu Giấy, Hà Nội', image:'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=900&q=70'},
      {id:'r02', title:'Căn hộ mini có ban công', price:6200000, area:32, people:2, ward:'P. Trung Liệt', district:'Đống Đa', address:'58 Thái Hà, P. Trung Liệt, Đống Đa, Hà Nội', image:'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=900&q=70'},
      {id:'r03', title:'Ở ghép nữ, an ninh tốt', price:2100000, area:16, people:3, ward:'P. Bạch Mai', district:'Hai Bà Trưng', address:'12/8 Bạch Mai, P. Bạch Mai, Hai Bà Trưng, Hà Nội', image:'https://images.unsplash.com/photo-1505873242700-f289a29e1e0f?auto=format&fit=crop&w=900&q=70'},
      {id:'r04', title:'Phòng có gác, cửa sổ lớn', price:3400000, area:24, people:2, ward:'P. Khương Trung', district:'Thanh Xuân', address:'21 Vũ Trọng Phụng, P. Khương Trung, Thanh Xuân, Hà Nội', image:'https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&fit=crop&w=900&q=70'},
      {id:'r05', title:'Studio khép kín gần Hồ Tây', price:5300000, area:26, people:2, ward:'P. Cống Vị', district:'Ba Đình', address:'9 Đội Cấn, P. Cống Vị, Ba Đình, Hà Nội', image:'https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=900&q=70'},
      {id:'r06', title:'Phòng khép kín, nuôi thú cưng', price:3100000, area:20, people:2, ward:'P. Tân Mai', district:'Hoàng Mai', address:'70 Tân Mai, P. Tân Mai, Hoàng Mai, Hà Nội', image:'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=900&q=70'},
      {id:'r07', title:'Ở ghép nam, gần sân vận động Mỹ Đình', price:1900000, area:20, people:3, ward:'P. Mỹ Đình 2', district:'Nam Từ Liêm', address:'5 Lê Đức Thọ, P. Mỹ Đình 2, Nam Từ Liêm, Hà Nội', image:'https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=900&q=70'},
      {id:'r08', title:'Phòng rộng, có bếp riêng', price:3900000, area:28, people:2, ward:'P. Khương Thượng', district:'Đống Đa', address:'112 Tôn Thất Tùng, P. Khương Thượng, Đống Đa, Hà Nội', image:'https://images.unsplash.com/photo-1567767292278-a4f21aa2d36e?auto=format&fit=crop&w=900&q=70'},
      {id:'r09', title:'Phòng khép kín, gần các trường Bách Kinh Xây', price:3300000, area:35, people:2, ward:'P. Vĩnh Tuy', district:'Hai Bà Trưng', address:'Phố Lạc Trung, P. Vĩnh Tuy, Hai Bà Trưng, Hà Nội', image:'../assets/rooms/phong-lac-trung-vinh-tuy.jpg'},
      {id:'r10', title:'Phòng gần Bách Khoa', price:4500000, area:20, people:2, ward:'P. Bạch Mai', district:'Hai Bà Trưng', address:'26 Đường Đại Cồ Việt, Phường Bạch Mai, Quận Hai Bà Trưng, Hà Nội', image:'../assets/rooms/phongtrobachkinhxaygiare1.webp'},
      {id:'r11', title:'Phòng trọ khép kín trong ngõ 210 Hoàng Quốc Việt', price:3300000, area:25, people:2, ward:'P. Nghĩa Đô', district:'Cầu Giấy', address:'Ngõ 210 Đường Hoàng Quốc Việt, Phường Nghĩa Đô, Quận Cầu Giấy, Hà Nội', image:'../assets/rooms/210hqv1.webp'},
      {id:'r12', title:'Phòng mới xây, đầy đủ tiện nghi', price:3500000, area:30, people:2, ward:'P. Hàng Bột', district:'Đống Đa', address:'Số nhà 20, ngách 79, ngõ Cẩm Văn, Phường Hàng Bột, Quận Đống Đa, Hà Nội', image:'../assets/rooms/moixay1.webp'},
      {id:'r13', title:'Phòng trọ khép kín Trần Thái Tông', price:3500000, area:28, people:2, ward:'P. Dịch Vọng Hậu', district:'Cầu Giấy', address:'Nhà 11A, Ngõ 35/17c Trần Thái Tông, Quận Cầu Giấy, Hà Nội', image:'../assets/rooms/ttt1.webp'},
      {id:'r14', title:'Phòng trọ sinh viên Hòa Lạc', price:1800000, area:20, people:2, ward:'X. Hòa Lạc', district:'Thạch Thất', address:'Đường Đại lộ Thăng Long, Xã Hòa Lạc, Huyện Thạch Thất, Hà Nội', image:'../assets/rooms/hoalac1.webp'},
      {id:'r15', title:'Phòng trọ giá rẻ gần chân ga Cầu Diễn', price:4250000, area:25, people:2, ward:'P. Phúc Diễn', district:'Nam Từ Liêm', address:'Ngõ 90 Đường Phúc Diễn, Quận Nam Từ Liêm, Hà Nội', image:'../assets/rooms/ga1.webp'},
      {id:'r16', title:'Phòng trọ tiện nghi giá tốt', price:3000000, area:30, people:2, ward:'P. Kim Liên', district:'Đống Đa', address:'2/54/16 Đường Tôn Thất Tùng, Phường Kim Liên, Quận Đống Đa, Hà Nội', image:'../assets/rooms/dd1.webp'},
      {id:'r17', title:'Trọ có 1 phòng ngủ 1 phòng khách', price:4000000, area:25, people:2, ward:'P. Xuân Phương', district:'Nam Từ Liêm', address:'Đường Tu Hoàng, Phường Xuân Phương, Quận Nam Từ Liêm, Hà Nội', image:'../assets/rooms/1n1k1.webp'},
      {id:'r18', title:'Phòng đầy đủ tiện nghi', price:2700000, area:25, people:2, ward:'P. Định Công', district:'Hoàng Mai', address:'Số nhà 26A, ngõ 220 Định Công Thượng, Phường Định Công, Quận Hoàng Mai, Hà Nội', image:'../assets/rooms/hmai1.webp'}
    ];

    function getSavedRooms(){
      try { return JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); }
      catch (e) { return []; }
    }
    function formatVnd(value){
      return new Intl.NumberFormat('vi-VN').format(value) + '₫';
    }
    function findRoomById(id){
      return ROOMS.find(function(room){ return room.id === id; });
    }
    function removeSavedRoom(id){
      var saved = getSavedRooms().filter(function(item){ return item !== id; });
      localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
      render();
    }
    function render(){
      var saved = getSavedRooms();
      var container = document.getElementById('savedList');
      var empty = document.getElementById('emptyState');
      var count = document.getElementById('savedCount');

      count.textContent = saved.length + ' phòng';
      if (!saved.length) {
        container.innerHTML = '';
        empty.classList.add('show');
        return;
      }

      empty.classList.remove('show');
      container.innerHTML = saved.map(function(id){
        var room = findRoomById(id);
        if (!room) return '';
        return '<article class="saved-card">' +
          '<div class="img"><img src="' + room.image + '" alt="' + room.title + '" /><span class="badge">' + formatVnd(room.price) + '/th</span></div>' +
          '<div class="content">' +
            '<h3>' + room.title + '</h3>' +
            '<div class="meta">' +
              '<span><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>' + room.ward + ', ' + room.district + '</span>' +
              '<span><svg viewBox="0 0 24 24"><path d="M3 8V3h5M21 8V3h-5M3 16v5h5M21 16v5h-5"/></svg>' + room.area + ' m²</span>' +
            '</div>' +
            '<div class="actions">' +
              '<a class="btn" href="tim-phong.html">Xem chi tiết</a>' +
              '<button class="btn remove-btn" type="button" data-remove-room="' + room.id + '">Bỏ lưu</button>' +
            '</div>' +
          '</div>' +
        '</article>';
      }).join('');

      document.querySelectorAll('[data-remove-room]').forEach(function(btn){
        btn.addEventListener('click', function(){ removeSavedRoom(btn.getAttribute('data-remove-room')); });
      });
    }
    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
