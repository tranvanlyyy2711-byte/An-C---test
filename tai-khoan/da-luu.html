<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng đã lưu — An Cư</title>
  <meta name="description" content="Các phòng trọ bạn đã lưu trên An Cư: xem lại chi tiết, đặt lịch xem hoặc bỏ lưu." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../components/sidebar.css" />
  <script src="../components/hop-dong.js"></script>
  <script src="../components/cau-hinh-supabase.js"></script>
<script src="../components/supabase-auth.js"></script>
<script src="../components/phien-xem-thu.js"></script>
<script src="../components/nguoi-dung.js"></script>
<script src="../components/an-cu-store.js"></script>
  <script src="../components/sidebar.js"></script>
  <style>
    :root{
      --bg:#F7FBF7;
      --surface:#FFFFFF;
      --surface-2:#F1F8F1;
      --border:rgba(34,139,34,.12);
      --border-strong:rgba(34,139,34,.2);
      --text:#102010;
      --text-muted:#4B5C4B;
      --text-dim:#667565;
      --accent:#228B22;
      --accent-hover:#1D7C1D;
      --accent-fg:#FFFFFF;
      --danger-ink:#B4291F;
      --radius-sm:8px;
      --radius:12px;
      --radius-lg:16px;
      --ease:cubic-bezier(.2,.7,.2,1);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter','Be Vietnam Pro',sans-serif;line-height:1.6}
    body{min-height:100vh}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    button,input,select{font:inherit}
    h1,h2,h3{font-family:'Be Vietnam Pro',sans-serif;letter-spacing:-.02em}
    /* Sidebar + thanh trên cùng: components/sidebar.css */
    .container{max-width:1200px;margin:0 auto}
    .page-head{margin-bottom:24px}
    .page-head h1{font-size:clamp(1.8rem,3vw,2.4rem);margin:0 0 8px;letter-spacing:-.03em}
    .page-head p{margin:0;color:var(--text-muted)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .status-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-family:'Be Vietnam Pro',sans-serif;font-size:13px;font-weight:600}
    .status-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(34,139,34,.12)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius);border:1px solid transparent;background:var(--accent);color:var(--accent-fg);font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease)}
    .btn:hover{background:var(--accent-hover)}
    .btn.ghost{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
    .btn.ghost:hover{background:var(--surface-2);border-color:var(--accent)}
    .btn:focus-visible,.icon-x:focus-visible,.card-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    /* Lưới thẻ phòng: ảnh 4:3, bo 12px, giá đè góc dưới */
    .saved-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    .saved-card{display:flex;flex-direction:column;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    .saved-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px -24px rgba(16,32,16,.35)}
    .saved-card .img{position:relative;aspect-ratio:4/3;background:var(--surface-2);margin:10px 10px 0;border-radius:var(--radius);overflow:hidden}
    .saved-card .img img{width:100%;height:100%;object-fit:cover}
    .saved-card .price-badge{position:absolute;left:10px;bottom:10px;background:rgba(16,32,16,.82);color:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-family:'Be Vietnam Pro',sans-serif;font-weight:700}
    .icon-x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:var(--accent);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px -8px rgba(16,32,16,.4)}
    .icon-x svg{width:19px;height:19px;stroke:currentColor;fill:currentColor;stroke-width:1.8;stroke-linejoin:round}
    .icon-x:hover{color:var(--danger-ink)}
    .saved-card .content{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px;flex:1}
    .saved-card h3{margin:0;font-size:1.05rem;line-height:1.4}
    .card-link:hover{color:var(--accent)}
    .saved-card .location{display:flex;align-items:flex-start;gap:8px;color:var(--text-muted);font-size:13.5px;line-height:1.5;margin:0}
    .saved-card .location svg{width:15px;height:15px;stroke:var(--text-dim);fill:none;stroke-width:1.8;margin-top:2px;flex-shrink:0}
    .saved-card .appt{margin:0;font-size:13px;color:var(--text-muted)}
    .saved-card .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:6px}

    .state{text-align:center;padding:56px 24px;border:1px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--surface)}
    .state h2{margin:0 0 8px;font-size:1.35rem}
    .state p{margin:0 auto 18px;color:var(--text-muted);max-width:52ch}
    .state .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .skel{border-radius:var(--radius-lg);background:linear-gradient(90deg,var(--surface-2),#fff,var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite;height:360px}
    @keyframes sk{to{background-position:-200% 0}}

    .reveal{opacity:0;transform:translateY(18px);transition:opacity .42s var(--ease),transform .42s var(--ease);transition-delay:var(--d,0s)}
    .reveal.in{opacity:1;transform:none}
    @media (prefers-reduced-motion: reduce){
      .reveal{opacity:1;transform:none;transition:none}
      .skel{animation:none}
      .saved-card,.saved-card:hover{transition:none;transform:none}
    }
    @media (max-width:1180px){ .saved-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:640px){ .saved-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="dash-shell">
    <an-cu-sidebar></an-cu-sidebar>
    <div class="dash-main">
      <an-cu-header></an-cu-header>
      <main class="dash-body">
        <div class="container">
          <header class="page-head reveal">
            <h1>Phòng đã lưu</h1>
            <p>Danh sách phòng bạn đã lưu để so sánh và đặt lịch xem sau này.</p>
          </header>

          <div class="toolbar reveal">
            <div class="status-pill"><span class="dot"></span><span id="savedCount"><b>0</b> phòng</span></div>
            <a href="tim-phong.html" class="btn ghost">Tiếp tục tìm phòng</a>
          </div>

          <div id="savedList" class="saved-grid" aria-live="polite" aria-busy="true">
            <div class="skel"></div><div class="skel"></div><div class="skel"></div>
          </div>
          <div id="savedState" hidden></div>
        </div>
      </main>
    </div>
  </div>

  <script>
  (function(){
    'use strict';
    var U = AnCu.util, esc = U.esc, vnd = U.vnd;
    // Không có máy chủ (file:// hoặc bản tĩnh): thông tin phòng lấy từ danh mục này. Khớp bộ chuẩn ROOMS
    // trong tim-phong.html và PHONG trong server/phong.mjs. Có máy chủ thì API trả sẵn thông tin phòng.
    var CATALOG = {
      p01:{ title:'Phòng gác lửng, thoáng sáng', address:'12 Nguyễn Khánh Toàn, P. Nghĩa Đô, Cầu Giấy, Hà Nội', price:2800000, image:'../assets/rooms/phong-lac-trung-vinh-tuy.jpg', phone:'0988000999' },
      p02:{ title:'Căn hộ mini full nội thất', address:'27 Đào Duy Anh, P. Kim Liên, Đống Đa, Hà Nội', price:4200000, image:'../assets/rooms/phongtrobachkinhxaygiare1.webp', phone:'0977111222' },
      p03:{ title:'Phòng ban công riêng, đón nắng', address:'88 Bạch Mai, P. Bạch Mai, Hai Bà Trưng, Hà Nội', price:3100000, image:'../assets/rooms/210hqv1.webp', phone:'0977111222' },
      p04:{ title:'Studio hiện đại gần trung tâm', address:'12 Khương Đình, P. Khương Đình, Thanh Xuân, Hà Nội', price:3900000, image:'../assets/rooms/moixay1.webp', phone:'0977111222' },
      p05:{ title:'Phòng khép kín, an ninh tốt', address:'56 Ngọc Hà, P. Ngọc Hà, Ba Đình, Hà Nội', price:2500000, image:'../assets/rooms/ttt1.webp', phone:'0988000999' },
      p06:{ title:'Phòng rộng, phù hợp gia đình', address:'203 Vĩnh Hưng, P. Vĩnh Hưng, Hoàng Mai, Hà Nội', price:4600000, image:'../assets/rooms/hoalac1.webp', phone:'0977111222' },
      p07:{ title:'Phòng trọ giá mềm cho sinh viên', address:'9 Lê Đức Thọ, P. Từ Liêm, Hà Nội', price:1800000, image:'../assets/rooms/ga1.webp', phone:'0988000999' },
      p08:{ title:'Phòng có gác, cửa sổ hướng vườn', address:'74 Âu Cơ, P. Tây Hồ, Hà Nội', price:3400000, image:'../assets/rooms/dd1.webp', phone:'0977111222' },
      p09:{ title:'Căn hộ dịch vụ 2 phòng ngủ', address:'15 Việt Hưng, P. Việt Hưng, Long Biên, Hà Nội', price:6500000, image:'../assets/rooms/hmai1.webp', phone:'0977111222' }
    };
    var ICON_PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
    var ICON_SAVED = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>';
    var ICON_CAL = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
    var listEl = document.getElementById('savedList'), stateEl = document.getElementById('savedState');
    var appts = [];   // lịch còn hiệu lực của tôi, để hiện "Đã đặt lịch" thay vì cho đặt trùng

    function roomsNow(){
      var f = AnCu.favorites.state();
      if(f.mode === 'server') return f.items.map(function(x){ return { id:x.roomId, title:x.title, address:x.address, price:x.price, image:x.image, phone:x.landlordPhone }; });
      return f.ids.filter(function(id){ return CATALOG[id]; }).map(function(id){ var c = CATALOG[id]; return { id:id, title:c.title, address:c.address, price:c.price, image:c.image, phone:c.phone }; });
    }
    function activeAppt(roomId){
      return appts.filter(function(a){ return a.roomId === roomId && (a.status === 'pending' || a.status === 'confirmed' || a.status === 'proposed'); })[0] || null;
    }
    function showState(html){ listEl.innerHTML = ''; listEl.hidden = true; stateEl.innerHTML = html; stateEl.hidden = false; }

    function render(){
      var f = AnCu.favorites.state();
      listEl.setAttribute('aria-busy', 'false');
      if(f.mode === 'guest'){
        document.querySelector('#savedCount b').textContent = '0';
        showState('<div class="state reveal in"><h2>Đăng nhập để xem phòng đã lưu</h2><p>Phòng bạn lưu được giữ theo tài khoản, xem được trên mọi thiết bị.</p>' +
          '<div class="acts"><button type="button" class="btn" data-login>Đăng nhập</button><a class="btn ghost" href="tim-phong.html">Tìm phòng</a></div></div>');
        return;
      }
      var rooms = roomsNow();
      document.querySelector('#savedCount b').textContent = rooms.length;
      if(!rooms.length){
        showState('<div class="state reveal in"><h2>Chưa có phòng nào được lưu</h2><p>Bấm biểu tượng Lưu ở danh sách, trên bản đồ hoặc trong chi tiết phòng để lưu lại và so sánh ở đây.</p>' +
          '<div class="acts"><a class="btn" href="tim-phong.html">Tìm phòng ngay</a></div></div>');
        return;
      }
      stateEl.hidden = true; listEl.hidden = false;
      listEl.innerHTML = rooms.map(function(r, i){
        var a = activeAppt(r.id);
        var st = a ? AnCu.STATUS[a.status] : null;
        return '<article class="saved-card reveal" style="--d:' + Math.min(i, 6) * 0.05 + 's" data-card="' + r.id + '">' +
          '<div class="img"><img src="' + esc(r.image) + '" alt="Ảnh ' + esc(r.title) + '" width="400" height="300" loading="lazy" />' +
            '<span class="price-badge">' + vnd(r.price) + '/tháng</span>' +
            '<button type="button" class="icon-x" data-unsave="' + r.id + '" aria-label="Bỏ lưu phòng ' + esc(r.title) + '" title="Bỏ lưu">' + ICON_SAVED + '</button></div>' +
          '<div class="content">' +
            '<h3><a class="card-link" href="tim-phong.html?phong=' + r.id + '">' + esc(r.title) + '</a></h3>' +
            '<p class="location">' + ICON_PIN + '<span>' + esc(r.address) + '</span></p>' +
            (a ? '<p class="appt">' + AnCu.statusBadge(a.status) + ' · ' + esc(a.time) + ' ngày ' + a.date.split('-').reverse().join('/') + '</p>' : '') +
            '<div class="actions">' +
              '<a class="btn ghost" href="tim-phong.html?phong=' + r.id + '">Xem chi tiết</a>' +
              (a ? '<a class="btn" href="dat-lich.html?lich=' + a.id + '">' + ICON_CAL + 'Xem lịch</a>'
                 : '<button type="button" class="btn" data-book="' + r.id + '">' + ICON_CAL + 'Đặt lịch xem</button>') +
            '</div>' +
          '</div>' +
        '</article>';
      }).join('');
      reveal();
    }

    // Lịch còn hiệu lực của tôi (máy chủ, hoặc kho lịch xem của trình duyệt khi không có máy chủ)
    function loadAppts(){
      return AnCu.ready.then(function(s){
        if(!s.on){ var o = null; try{ o = JSON.parse(localStorage.getItem('an-cu-lich-xem-v1') || 'null'); }catch(e){} appts = o && o.items ? o.items : []; return; }
        return AnCu.api('GET', '/api/lich-xem').then(function(j){ appts = j.ok ? j.items || [] : []; });
      }).catch(function(){ appts = []; });
    }

    listEl.addEventListener('click', function(e){
      var b = e.target.closest('[data-book]');
      if(b){
        var r = roomsNow().filter(function(x){ return x.id === b.getAttribute('data-book'); })[0];
        if(r) AnCu.openBooking(r);
        return;
      }
      var x = e.target.closest('[data-unsave]');
      if(x){
        x.disabled = true;
        var title = (roomsNow().filter(function(r){ return r.id === x.getAttribute('data-unsave'); })[0] || {}).title;
        AnCu.favorites.toggle(x.getAttribute('data-unsave'), title);
      }
    });
    stateEl.addEventListener('click', function(e){ if(e.target.closest('[data-login]')) AnCu.goLogin(); });

    function reveal(){
      var els = document.querySelectorAll('.reveal:not(.in)');
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)){
        els.forEach(function(el){ el.classList.add('in'); }); return;
      }
      var io = new IntersectionObserver(function(en){
        en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } });
      }, { rootMargin:'0px 0px -10% 0px' });
      els.forEach(function(el){ io.observe(el); });
    }

    // Phòng lưu / bỏ lưu ở bất kỳ đâu (tab khác, trang Tìm phòng) → danh sách đổi ngay
    AnCu.favorites.subscribe(render);
    AnCu.on('lich-hen', function(){ loadAppts().then(render); });
    Promise.all([loadAppts(), AnCu.favorites.load()]).then(render).catch(function(){
      listEl.setAttribute('aria-busy', 'false');
      showState('<div class="state"><h2>Chưa tải được phòng đã lưu</h2><p>Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.</p>' +
        '<div class="acts"><button type="button" class="btn" onclick="location.reload()">Tải lại</button></div></div>');
    });
    reveal();
  })();
  </script>
</body>
</html>
